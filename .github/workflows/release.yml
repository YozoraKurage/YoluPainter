name: 配布物の作成

on:
  workflow_dispatch:
    inputs:
      kind:
        description: 配布の種類
        required: true
        type: choice
        default: prerelease
        options: [prerelease, stable]
      dry-run:
        description: 検証のみ（Draft Release を作らない）
        required: true
        type: boolean
        default: true
      linux:
        description: Linux の配布物も作る（wayland-protocols の LGPL の表記の判断が済むまで切）
        required: true
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.linux && '[{"os":"windows-latest","target":"x86_64-pc-windows-msvc"},{"os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu"}]' || '[{"os":"windows-latest","target":"x86_64-pc-windows-msvc"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Linux のビルド依存
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev pkg-config
      - name: Rust を準備
        run: rustup toolchain install stable --profile minimal --no-self-update --target ${{ matrix.target }}
      - run: rustup default stable
      - name: NSIS を準備（Windows。runner に無ければ Chocolatey で 3.11.0 を入れ、どちらでも 3.11 であることを確かめる）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nsisDir = 'C:\Program Files (x86)\NSIS'
          $found = Get-Command makensis -ErrorAction SilentlyContinue
          if ($found) {
            $makensis = $found.Source
          } elseif (Test-Path "$nsisDir\makensis.exe") {
            $makensis = "$nsisDir\makensis.exe"
          } else {
            choco install nsis --version=3.11.0 --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'NSIS 3.11.0 を入れられません' }
            $makensis = "$nsisDir\makensis.exe"
          }
          # 配布物の作り方を変えないため、入っていた物でも入れた物でも、使うのは 3.11 だけ（版が違えば止める）
          $version = (& $makensis /VERSION | Out-String).Trim()
          Write-Host "makensis: ${makensis} (${version})"
          if ($version -notmatch '^v3\.11(\.0)?$') { throw "NSIS は 3.11 が要ります（${makensis} は ${version}）" }
          # 確かめた物を、あとの手順（cargo xtask installer）が使う
          "MAKENSIS=$makensis" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: PDB の設定（Windows。クラッシュの記録の番地を、同じ版の関数名・行へ引くための付属物を作る）
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # 行番号つきの PDB を、実行ファイルとは別のファイルに作る（命令は変えない）。PDB を確実に作るため、debug と strip を既定任せにしない
          echo "CARGO_PROFILE_RELEASE_DEBUG=line-tables-only" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_RELEASE_STRIP=none" >> "$GITHUB_ENV"
      - name: ビルドと配布物の作成
        env:
          PYTHON: python
          # 公開鍵は秘密ではない。入っていればアプリに組み込まれ、更新の項目が出る
          YOLUPAINTER_UPDATE_PUBLIC_KEY: ${{ vars.YOLUPAINTER_UPDATE_PUBLIC_KEY }}
          REQUIRE_KEY: ${{ !inputs.dry-run && '--require-update-key' || '' }}
        shell: bash
        run: |
          cargo xtask build --target ${{ matrix.target }} --release $REQUIRE_KEY
          cargo xtask bundle --target ${{ matrix.target }}
          if [ "$RUNNER_OS" = Windows ]; then
            cargo xtask installer --target ${{ matrix.target }}
            # PDB を Release の付属物（yolupainter-<版>-<対象>-pdb.zip）にする。更新の対象ではなく、署名つきの更新情報には載らない
            cargo xtask symbols --target ${{ matrix.target }}
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bundle-${{ matrix.target }}
          path: target/dist/*
          if-no-files-found: error
          retention-days: 7

  metadata:
    needs: build
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: bundle-*
          path: target/dist
          merge-multiple: true
      - run: rustup toolchain install stable --profile minimal --no-self-update
      - run: rustup default stable
      - name: 版の確認
        id: version
        shell: bash
        env:
          RELEASE_KIND: ${{ inputs.kind }}
        run: |
          cargo metadata --locked --no-deps --format-version 1 > target/metadata.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          m = json.loads(Path('target/metadata.json').read_text())
          v = next(p['version'] for p in m['packages'] if p['name'] == 'yolu-app')
          if os.environ['RELEASE_KIND'] == 'stable' and '-' in v:
              raise SystemExit('stable にプレリリース版は使えません')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('version=' + v + '\n')
          PY
      - name: 未署名の更新情報を確認
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: cargo xtask updater-json --version "$VERSION" --assets target/dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-preview
          path: target/dist/*
          if-no-files-found: error
          retention-days: 7

  draft:
    if: ${{ !inputs.dry-run }}
    needs: metadata
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-preview
          path: target/dist
      - run: rustup toolchain install stable --profile minimal --no-self-update
      - run: rustup default stable
      - name: 署名ツールをビルド
        run: cargo build --locked -p xtask
      - name: 更新情報に署名
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          YOLUPAINTER_UPDATE_PRIVATE_KEY: ${{ secrets.YOLUPAINTER_UPDATE_PRIVATE_KEY }}
        run: target/debug/xtask updater-json --version "$VERSION" --assets target/dist --sign
      - name: 公開鍵で署名と配布物を確認
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          PUBLIC_KEY: ${{ vars.YOLUPAINTER_UPDATE_PUBLIC_KEY }}
        run: target/debug/xtask verify --version "$VERSION" --assets target/dist --public-key "$PUBLIC_KEY"
      - name: Draft Release を作成
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_KIND: ${{ inputs.kind }}
        shell: bash
        run: |
          args=(--draft --target "$GITHUB_SHA" --title "YoluPainter $VERSION" --notes '')
          if [ "$RELEASE_KIND" = prerelease ]; then args+=(--prerelease); fi
          gh release create "v$VERSION" "${args[@]}" target/dist/*
