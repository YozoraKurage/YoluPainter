name: 配布物の作成

on:
  workflow_dispatch:
    inputs:
      kind:
        description: 配布の種類
        required: true
        type: choice
        default: prerelease
        options: [prerelease, stable]
      dry-run:
        description: 検証のみ（Draft Release を作らない）
        required: true
        type: boolean
        default: true
      linux:
        description: Linux の配布物も作る（wayland-protocols の LGPL の表記の判断が済むまで切）
        required: true
        type: boolean
        default: false
      macos:
        description: macOS の試作の配布物（署名なしの .app の zip）も作る（切にすると、macOS を載せずに配る）
        required: true
        type: boolean
        default: true
      rebuild:
        description: CI の成果物を受け取らず、必ずビルドし直す
        required: true
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

# 配る物は、同じ木で全部のジョブが成功した main 向けの PR の CI（ci.yml）がビルドした成果物を受け取る（find）。受け取れなければ、同じ手順（dist-build.yml）でビルドする
# （理由は実行の Summary に出る）。どちらの道でも、metadata 以降は同じ。docs/RELEASING.md に安全の筋と保証しないことを書く。
# このワークフローはキャッシュを使わない（汚染されたキャッシュが配る物に入る道を作らない。tools/check-workflows.py が確かめる）。
jobs:
  plan:
    name: 対象と木
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      targets: ${{ steps.plan.outputs.targets }}
      experimental: ${{ steps.plan.outputs.experimental }}
      pattern: ${{ steps.plan.outputs.pattern }}
      tree: ${{ steps.plan.outputs.tree }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - id: plan
        run: python3 tools/dist.py plan --input linux=${{ inputs.linux }} --input macos=${{ inputs.macos }}

  find:
    name: CI の成果物を探す
    needs: plan
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    outputs:
      promote: ${{ steps.find.outputs.promote }}
      run-id: ${{ steps.find.outputs.run-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          YOLUPAINTER_UPDATE_PUBLIC_KEY: ${{ vars.YOLUPAINTER_UPDATE_PUBLIC_KEY }}
          TREE: ${{ needs.plan.outputs.tree }}
          TARGETS: ${{ needs.plan.outputs.targets }}
          OPTIONAL: ${{ needs.plan.outputs.experimental }}
          REBUILD: ${{ inputs.rebuild }}
        run: >
          python3 tools/dist.py find --repo "$GITHUB_REPOSITORY" --tree "$TREE" --targets "$TARGETS" --optional "$OPTIONAL"
          --work "$RUNNER_TEMP/found" --rebuild "$REBUILD"

  build:
    name: ビルド
    needs: [plan, find]
    if: ${{ needs.find.outputs.promote != 'true' }}
    uses: ./.github/workflows/dist-build.yml
    with:
      matrix: ${{ needs.plan.outputs.matrix }}
      require-update-key: ${{ !inputs.dry-run }}
      update-public-key: ${{ vars.YOLUPAINTER_UPDATE_PUBLIC_KEY }}
      retention-days: 7

  metadata:
    needs: [plan, find, build]
    # build の結果は見ない（ビルドを飛ばした = 受け取ったときは skipped、試作の対象（macOS）だけが落ちたときの結果は GitHub の扱いに依る）。
    # 試作でない対象（Windows）の成果物が欠ければ、下の「集める」（tools/dist.py install）が止める。試作の対象の成果物が無いときは、
    # 載せずに進み、載らなかった理由を実行の Summary に出す。
    if: ${{ !cancelled() && needs.find.result == 'success' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      # この実行でビルドした成果物
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: ${{ needs.find.outputs.promote != 'true' }}
        with:
          pattern: ${{ needs.plan.outputs.pattern }}
          path: target/received
      # CI から受け取る成果物（探す段が、同じ木・全部のジョブが成功・目録の SHA-256 を確かめた実行のもの）
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: ${{ needs.find.outputs.promote == 'true' }}
        with:
          pattern: ${{ needs.plan.outputs.pattern }}
          path: target/received
          run-id: ${{ needs.find.outputs.run-id }}
          github-token: ${{ github.token }}
      - run: rustup toolchain install stable --profile minimal --no-self-update
      - run: rustup default stable
      - name: 版の確認
        id: version
        shell: bash
        env:
          RELEASE_KIND: ${{ inputs.kind }}
        run: |
          cargo metadata --locked --no-deps --format-version 1 > target/metadata.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          m = json.loads(Path('target/metadata.json').read_text())
          v = next(p['version'] for p in m['packages'] if p['name'] == 'yolu-app')
          if os.environ['RELEASE_KIND'] == 'stable' and '-' in v:
              raise SystemExit('stable にプレリリース版は使えません')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('version=' + v + '\n')
          PY
      # PR の CI の事前確認が見たのは、その PR の時点のタグ。CI から受け取る道でも、出す今、タグがまだ無いことと種類・版が合うことを確かめ直す。
      - name: 版の事前確認（タグがまだ無い・種類と版が合う）
        env:
          RELEASE_KIND: ${{ inputs.kind }}
        run: cargo xtask preflight --only version --kind "$RELEASE_KIND"
      - name: 受け取った配る物の目録を確認して集める
        env:
          TREE: ${{ needs.plan.outputs.tree }}
          TARGETS: ${{ needs.plan.outputs.targets }}
          OPTIONAL: ${{ needs.plan.outputs.experimental }}
          VERSION: ${{ steps.version.outputs.version }}
          YOLUPAINTER_UPDATE_PUBLIC_KEY: ${{ vars.YOLUPAINTER_UPDATE_PUBLIC_KEY }}
        run: python3 tools/dist.py install --received target/received --tree "$TREE" --targets "$TARGETS" --optional "$OPTIONAL" --version "$VERSION" --out target/dist
      - name: 未署名の更新情報を確認
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: cargo xtask updater-json --version "$VERSION" --assets target/dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-preview
          path: target/dist/*
          if-no-files-found: error
          retention-days: 7

  draft:
    # 状態の関数（!cancelled()）を明示する。書かないと暗に success() が付き、CI の成果物を受け取って build が skipped の回に、
    # metadata が成功していても下書きまで飛ばされる（needs の先の skipped が伝わる）。
    if: ${{ !cancelled() && !inputs.dry-run && needs.metadata.result == 'success' }}
    needs: metadata
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-preview
          path: target/dist
      - run: rustup toolchain install stable --profile minimal --no-self-update
      - run: rustup default stable
      - name: 署名ツールをビルド
        run: cargo build --locked -p xtask
      - name: 更新情報に署名
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          YOLUPAINTER_UPDATE_PRIVATE_KEY: ${{ secrets.YOLUPAINTER_UPDATE_PRIVATE_KEY }}
        run: target/debug/xtask updater-json --version "$VERSION" --assets target/dist --sign
      - name: 公開鍵で署名と配布物を確認
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          PUBLIC_KEY: ${{ vars.YOLUPAINTER_UPDATE_PUBLIC_KEY }}
        run: target/debug/xtask verify --version "$VERSION" --assets target/dist --public-key "$PUBLIC_KEY"
      # kind=prerelease の Draft は、公開すると beta-channel.yml が動き、試験版の置き場（固定のタグ updater-beta）へ署名つきの更新情報を置く
      # （Draft のうちは置かない）。kind=stable の流れはこれまでどおり（releases/latest が切り替わる）。
      - name: Draft Release を作成
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_KIND: ${{ inputs.kind }}
        shell: bash
        run: |
          args=(--draft --target "$GITHUB_SHA" --title "YoluPainter $VERSION" --notes '')
          if [ "$RELEASE_KIND" = prerelease ]; then args+=(--prerelease); fi
          gh release create "v$VERSION" "${args[@]}" target/dist/*
