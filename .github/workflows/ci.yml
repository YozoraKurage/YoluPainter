name: CI

# main は CI 必須の PR からしか変わらない（ruleset）。main への push ではビルドし直さず、main-tested.yml が「PR で試した中身か」だけを確かめる。
# 配る物は main 向けの PR の CI（下の dist）がビルドし、配布（release.yml）はその成果物を受け取る。
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ビルドし直しが長い（アプリの試験の実行形式は 9 本。結合試験は 4 本の束と直下の 3 本）ので、画面の試験は別のジョブに分けて並べて回す。
  #
  # runs-on は ubuntu-latest にしない。収録済みの正解は glibc と Mesa の版に結びつく（描画しないクレートの golden は glibc の tan・atan・
  # atan2 とビット一致、画面の正解は Mesa の lavapipe）。ubuntu-latest は 2026-10-19 から Ubuntu 26 に移るので、glibc・Mesa を測り直して
  # から、版を決めて移す（確かめたのは glibc 2.35・2.39 と Mesa 23.2・25.2 だけ）。
  linux:
    name: Linux の試験と静的検査
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Rust の準備
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # 試験が落ちた回でもビルドした結果を残す（残さないと落ちている間は毎回 10 分以上かけてビルドし直す）
          cache-on-failure: true
      - name: ビルドとソフトウェア描画の依存を導入
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config libx11-dev libxi-dev libxrandr-dev \
            libxcursor-dev libxkbcommon-dev libwayland-dev zlib1g-dev \
            libegl1 libgl1-mesa-dri libglx-mesa0 libvulkan1 mesa-vulkan-drivers \
            xvfb xauth nsis python3-yaml
      - name: 描画しないクレートの試験（並列）
        run: cargo test --workspace --exclude yolu-app --exclude yolu-gpu --locked --no-fail-fast
      - name: 配る物のツールの試験（tools/dist.py・tools/check-workflows.py）、画面の試験を並べるツールの試験、通信の見張りのツールの試験
        if: ${{ !cancelled() }}
        run: |
          python3 tools/test-dist.py
          python3 tools/test-render-tests.py
          python3 tools/test-network-watch.py
      - name: Clippy（警告をエラーにする）
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: 整形（cargo fmt の確かめ）
        if: ${{ !cancelled() }}
        run: cargo fmt --all -- --check

  linux-render:
    name: Linux の画面の試験（ソフトウェアの Vulkan）
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Rust の準備
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # 試験が落ちた回でもビルドした結果を残す（残さないと落ちている間は毎回 10 分以上かけてビルドし直す）
          cache-on-failure: true
          # 通信の見張りのジョブ（linux-network）がこのキャッシュを読む（保存はこのジョブだけ）
          shared-key: linux-render
      - name: ビルドとソフトウェア描画の依存を導入
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config libx11-dev libxi-dev libxrandr-dev \
            libxcursor-dev libxkbcommon-dev libwayland-dev zlib1g-dev \
            libegl1 libgl1-mesa-dri libglx-mesa0 libvulkan1 mesa-vulkan-drivers \
            xvfb xauth nsis
      # 試験の実行ファイルごとの別のプロセスを 3 列に並べて回す（列の中は順に、プロセスの中は 1 本ずつ。並べ方は tools/render-tests.py の頭）。
      # ウィンドウ・GPU の装置を同じプロセスで同時に作ると lavapipe の中で落ちることがあったので、プロセスの中は前と同じく 1 本ずつにしている。
      # 回す間は全体で 20 分（--time-limit）で区切る。止まった試験はスクリプトが殺し、その名前をジョブのログに出す（ジョブの 45 分で切られると残らない）。
      - name: 描画する試験（束ごとのプロセスを並べ、プロセスの中は 1 本ずつ）
        env:
          # 収録済みの画面の正解は、手元の既定（wgpu の Vulkan と Mesa の lavapipe）で撮ったもの。GL の llvmpipe は
          # コンピュートが足りず（GPU 合成の試験が省略になる）、環境の反射の絵も違うので使わない。
          WGPU_BACKEND: vulkan
          # アダプターを取れないとき、GPU の試験を飛ばして通った扱いにせず、落とす
          YOLUPAINTER_REQUIRE_GPU: "1"
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/yolu-runtime"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          xvfb-run -a python3 tools/render-tests.py --log-dir "$RUNNER_TEMP/render-logs"
      - name: 画面の正解との差の画像を残す
        if: failure()
        shell: bash
        run: |
          # .new.png は落ちたときにだけ書かれる（画像の大きさが違う・正解の PNG が無い試験は .new.png だけで、.diff.png は
          # 閾値を越えたときだけ）。.new.png を基準に回し、対応する .diff.png があれば一緒に写す。
          mkdir -p "$RUNNER_TEMP/snapshot-diffs"
          cd crates/yolu-app/tests/snapshots
          for n in *.new.png; do
            [ -e "$n" ] || continue
            cp "$n" "$RUNNER_TEMP/snapshot-diffs/"
            d="${n%.new.png}.diff.png"
            if [ -e "$d" ]; then
              cp "$d" "$RUNNER_TEMP/snapshot-diffs/"
            fi
          done
      - name: 差の画像をアップロード
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snapshot-diffs
          path: ${{ runner.temp }}/snapshot-diffs
          if-no-files-found: ignore

  # 実際の通信の見張り（tools/network-watch.py）。本物のアプリを strace の下で動かし、外への接続の試みが更新の確認の curl だけであることを見る。
  # 画面の試験のジョブと別にしているのは、更新の確認を動かすために更新用の公開鍵を組み込んで作るため: 公開鍵の環境変数を変えると yolu-update と
  # yolu-app を作り直すので、同じジョブで作ると、画面の試験の作った物のキャッシュが、次の回の画面の試験のビルドのやり直しになる。
  # キャッシュは画面の試験のジョブ（linux-render）と共有キーで読み（試験を回した後の target を使うので、作り直すのは yolu-update と yolu-app だけ）、
  # このジョブは保存しない（save-if: false。鍵つきの物で上書きしない）。
  # 組み込む鍵は使い捨ての公開鍵（秘密鍵は捨てた。配る物の鍵ではない）で、このジョブのアプリはどこにも配らない。
  linux-network:
    name: Linux の通信の見張り（strace）
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Rust の準備
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: linux-render
          # 読むだけ。鍵つきのビルドの結果で、画面の試験のキャッシュを上書きしない
          save-if: false
      - name: ビルドとソフトウェア描画と strace の依存を導入
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config libx11-dev libxi-dev libxrandr-dev \
            libxcursor-dev libxkbcommon-dev libwayland-dev zlib1g-dev \
            libegl1 libgl1-mesa-dri libglx-mesa0 libvulkan1 mesa-vulkan-drivers \
            xvfb xauth strace xdotool
      - name: 見張りのツールの試験
        run: python3 tools/test-network-watch.py
      - name: アプリのビルド（使い捨ての更新用の公開鍵つき）
        env:
          YOLUPAINTER_UPDATE_PUBLIC_KEY: 6acc8faaa5f8beb6897bc7936ab6b930853dc4e563e4dc5f49a76f156ab16201
        run: cargo build -p yolu-app -p yolu-cli --locked
      # 起動 4 回（既定・受け口あり・開き直し・更新の確認あり）。外への接続・送信・名前の引き・待ち受けの試みを読み、終わりに場面ごとの表を出す。
      - name: 実際の通信の見張り
        env:
          WGPU_BACKEND: vulkan
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/yolu-runtime"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          xvfb-run -a -s "-screen 0 1920x1080x24" python3 tools/network-watch.py --log-dir "$RUNNER_TEMP/network-logs" --time-limit 900
      - name: strace のログを残す
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: network-logs
          path: ${{ runner.temp }}/network-logs
          if-no-files-found: ignore

  windows:
    name: Windows のビルドと画面なし試験
    runs-on: windows-latest
    # キャッシュの無い回は、ビルドだけで 40 分を超える（0.4.0 で yolu-cli・rmcp と試験の実行ファイルが増えた）。一度通ってキャッシュが残れば短くなる
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Rust の準備
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # 試験が落ちた回でもビルドした結果を残す（残さないと落ちている間は毎回 10 分以上かけてビルドし直す）
          cache-on-failure: true
      - name: アプリのビルド
        run: cargo build -p yolu-app -p yolu-cli --locked
      - name: 描画を使わないクレートの試験
        if: ${{ !cancelled() }}
        run: cargo test --locked --no-fail-fast -p yolu-core -p yolu-io -p yolu-brush-sets -p yolu-protocol -p yolu-ops -p yolu-cli -- --test-threads=1
      - name: アプリの単体試験（画面なし）
        if: ${{ !cancelled() }}
        run: cargo test -p yolu-app --lib --locked -- --test-threads=1
      # 結合試験は束（tests/<束>/main.rs）の中にあり、試験の名前は `<ファイル名>::<試験名>`。画面なしの試験は名前が `headless_` で始まる
      - name: 自動更新の統合試験（画面なし）
        if: ${{ !cancelled() }}
        run: cargo test -p yolu-app --test gui_shell --locked -- update::headless_ --test-threads=1
      - name: ブラシの一覧の統合試験（画面なし。保存と読み戻し・壊れたファイル）
        if: ${{ !cancelled() }}
        run: cargo test -p yolu-app --test headless --locked -- brush_list::headless_ --test-threads=1
      - name: 復旧の試験（画面なし。OS のロック・置換・落ちた体の起動）
        if: ${{ !cancelled() }}
        run: cargo test -p yolu-app --test headless --locked -- recovery::headless_ --test-threads=1
      - name: Live Link のファイルの受け渡しと .ylp の選択範囲・ポーズの試験（画面なし。自分だけのフォルダ・ファイルの置換）
        if: ${{ !cancelled() }}
        run: cargo test -p yolu-app --test headless --locked -- livelink_files::headless_ saved_selections::headless_ pose_saved::headless_ --test-threads=1

  macos:
    name: macOS のビルドと画面なし試験
    # Apple Silicon の runner。アプリが macOS でビルドできること（タブレットの入力の `pen::mac_tablet` を含む）と、画面を使わない試験が通ることを見る。
    # GPU・画面の統合試験は対象外。配る物（.app と ad-hoc の署名）は、下の dist のジョブ（dist-build.yml）が別の macOS の runner で作る。キャッシュの無い回の長さはまだ測っていない（最初の回を見て決め直す）
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Rust の準備
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # 試験が落ちた回でもビルドした結果を残す（残さないと落ちている間は毎回ビルドし直す）
          cache-on-failure: true
      - name: アプリのビルド
        run: cargo build -p yolu-app -p yolu-cli --locked
      - name: 描画を使わないクレートの試験
        if: ${{ !cancelled() }}
        run: cargo test --locked --no-fail-fast -p yolu-core -p yolu-io -p yolu-brush-sets -p yolu-protocol -p yolu-ops -p yolu-cli -- --test-threads=1
      - name: アプリの単体試験（画面なし）
        if: ${{ !cancelled() }}
        run: cargo test -p yolu-app --lib --locked -- --test-threads=1
      # Windows のジョブが回す、OS のロックとファイルの置換を使う画面なしの結合試験のうち、2 組（復旧のロックと、Live Link の受け渡しのフォルダ・ファイル）。
      # ほかの組（更新・ブラシの一覧・選択範囲・ポーズの保存）は、このジョブでは回さない（Linux の画面の試験が、同じ試験を Unix で回している）
      - name: 復旧と Live Link のファイルの受け渡しの試験（画面なし）
        if: ${{ !cancelled() }}
        run: cargo test -p yolu-app --test headless --locked -- recovery::headless_ livelink_files::headless_ --test-threads=1

  # 配る物のビルド。main 向けの、同じリポジトリの枝からの PR だけ（フォークの PR には更新用の公開鍵の変数も渡らず、配る物にもしない）。
  # 上の試験のジョブと並べて走る。Windows のビルドは待ち時間を延ばさない（macOS のビルドの時間は、GitHub の runner ではまだ測っていない。
  # 試作の対象なので、落ちても CI の結論は失敗にならず、時間の上限は dist-targets.json の timeout_minutes）。配布（release.yml）が、木が同じでこの実行の全部のジョブ（試作の対象のジョブを除く）が成功していれば、ビルドし直さず受け取る。
  dist-plan:
    name: 配る物のビルドの計画
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      # 対象は tools/dist-targets.json の「入力が要らない対象」（Windows）と「入力の既定が入の対象」（macOS の試作）だけ（Linux は wayland-protocols の LGPL の判断が済むまで入れない）
      - id: plan
        run: python3 tools/dist.py plan

  dist:
    name: 配る物のビルド
    needs: dist-plan
    uses: ./.github/workflows/dist-build.yml
    with:
      matrix: ${{ needs.dist-plan.outputs.matrix }}
      require-update-key: true
      update-public-key: ${{ vars.YOLUPAINTER_UPDATE_PUBLIC_KEY }}
      retention-days: 14
