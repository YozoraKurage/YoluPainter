[package]
name = "yolu-ops"
version.workspace = true
license.workspace = true
edition.workspace = true
publish.workspace = true
description = "外から文書を操作する命令（読む・見本・レイヤーと効果と値の編集・書き出し・保存）の型と、画面なしで .ylp を操作するホスト。"

[dependencies]
yolu-core.workspace = true
yolu-io.workspace = true
serde = { version = "1", features = ["derive"] }   # MIT OR Apache-2.0（命令・返事・誤りの JSON）
serde_json = "1"   # MIT OR Apache-2.0（yolu-io が既に使っている）
schemars = "1.2"   # MIT（命令・返事・誤りの JSON Schema。型から作る）
png = "0.18"   # MIT OR Apache-2.0（見本の画像。yolu-io が既に使っている版）
