[package]
name = "yolu-io"
version.workspace = true
license.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# ストロークの段ごとの時間の計測（examples/stroke_bench_imported.rs）
stroke-profile = ["yolu-core/stroke-profile"]

[dependencies]
flate2 = { version = "1", default-features = false, features = ["zlib"] }
crc32fast = "1"
sha2 = "0.10"
rayon = "1.12"   # MIT OR Apache-2.0（保存の確かめ・1 回目の数えを、エントリごとに並べる。yolu-core・yolu-app が既に使っている版）
serde = "1"
serde_json = "1"
png = "0.18"
# CLIP STUDIO のブラシ（.sut）は SQLite。読み取り専用・メモリ上で開く（bundled の SQLite はパブリックドメイン、rusqlite は MIT）
rusqlite = { version = "0.40", default-features = false, features = ["bundled", "serialize", "limits", "hooks"] }
# OS に入っているフォントの一覧（テキストレイヤーのフォントを選ぶ・探す）。fontconfig の設定は読まない（fontconfig-parser と roxmltree を足さない）
fontdb = { version = "0.24", default-features = false, features = ["std", "fs", "memmap"] }   # MIT
yolu-core.workspace = true
yolu-brush-sets.workspace = true
