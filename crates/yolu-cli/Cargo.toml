[package]
name = "yolu-cli"
version.workspace = true
license.workspace = true
edition.workspace = true
publish.workspace = true
description = "yolupainter-cli: 命令の JSON を .ylp（画面なし）か起動中のアプリへ当てるコマンドラインと、標準入出力の MCP を起動中のアプリへ中継する口。"

[lib]
name = "yolu_cli"
path = "src/lib.rs"

[[bin]]
name = "yolupainter-cli"
path = "src/main.rs"

[dependencies]
yolu-mcp.workspace = true   # 起動中のアプリの MCP の受け口への客（中継・命令）と、ツールの定義（schema --tools）
yolu-ops.workspace = true
serde_json = "1"   # MIT OR Apache-2.0
tokio = { version = "1", features = ["rt", "io-std", "io-util", "sync", "time"] }   # MIT

[dev-dependencies]
yolu-core.workspace = true
yolu-io.workspace = true
