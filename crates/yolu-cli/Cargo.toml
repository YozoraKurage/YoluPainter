[package]
name = "yolu-cli"
version.workspace = true
license.workspace = true
edition.workspace = true
publish.workspace = true
description = "yolupainter-cli: 命令の JSON を .ylp（画面なし）か起動中のアプリへ当てるコマンドラインと、MCP サーバー（stdio）。"

[lib]
name = "yolu_cli"
path = "src/lib.rs"

[[bin]]
name = "yolupainter-cli"
path = "src/main.rs"

[dependencies]
yolu-ops.workspace = true
yolu-protocol.workspace = true
serde = { version = "1", features = ["derive"] }   # MIT OR Apache-2.0
serde_json = "1"   # MIT OR Apache-2.0
rmcp = { version = "3.5", default-features = false, features = ["server", "transport-io"] }   # Apache-2.0（公式の Rust SDK）
tokio = { version = "1", features = ["rt", "macros", "io-std", "io-util", "sync", "time"] }   # MIT

[dev-dependencies]
yolu-core.workspace = true
yolu-io.workspace = true
