[package]
name = "yolu-core"
version.workspace = true
license.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
glam = "0.33"
rayon = "1.12"

sha2 = "0.10"
# テキストレイヤー: 並べ・字の形・塗り。どれも egui（epaint）が既に使っている版で、許諾は登録済み
harfrust = "0.12"   # MIT
skrifa = { version = "0.44", default-features = false, features = ["std"] }   # MIT OR Apache-2.0
vello_cpu = { version = "0.1", default-features = false, features = ["std", "u8_pipeline"] }   # Apache-2.0 OR MIT

[features]
# ストロークの段ごとの時間の計測（examples/stroke_bench.rs が読む）。既定は無効で、無いときは何も残らない
stroke-profile = []

[dev-dependencies]
# 試験だけ: glibc 以外（Windows など）でペンの傾きの式を、OS に依らない数学の実装（musl の移植）と ulp で比べる
libm = "0.2"
