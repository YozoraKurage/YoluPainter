[package]
name = "yolu-app"
version.workspace = true
license.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "yolu_app"
path = "src/lib.rs"

[[bin]]
name = "yolupainter"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland", "accesskit"] }
egui = "0.36"
egui_dock = { version = "0.21", features = ["serde"] }   # ドックの並びの保存（`layout`。egui_dock が持つ serde の対応）
yolu-core.workspace = true
yolu-gpu.workspace = true
yolu-io.workspace = true
yolu-model.workspace = true
yolu-ops.workspace = true   # 外からの操作（MCP・コマンドライン）の命令。起動中のアプリのホストは `ops_host`
yolu-mcp.workspace = true   # 外からの操作の受け口（127.0.0.1 の MCP。`mcp_server`）
tokio = { version = "1", default-features = false, features = ["sync"] }   # MIT（受け口のスレッドから画面のスレッドへの一回きりの返事の口。yolu-mcp が使う版）
yolu-protocol.workspace = true
yolu-update.workspace = true   # 更新の確かめ（署名・版・SHA-256・大きさ）。通信は `update/http.rs`
serde = "1"   # MIT OR Apache-2.0（ドックのタブの名前の保存。yolu-io・yolu-update が既に使っている）
serde_json = "1"   # MIT OR Apache-2.0（ドックの並びとウィンドウの位置の保存。yolu-io が既に使っている）
half = "2.7"   # MIT OR Apache-2.0（環境のキューブを half float で上げる。wgpu の naga が既に使っている版）
rayon = "1.12"   # MIT OR Apache-2.0（環境の畳み込みを並べる。yolu-core が既に使っている）
bevy_mikktspace = "1.0"   # Zlib AND (MIT OR Apache-2.0)（接線。Unity の RecalculateTangents と同じ MikkTSpace。依存なし・unsafe なし）
image = { version = "0.25", default-features = false, features = ["png", "tga", "jpeg"] }   # Live Link の元の絵（PNG・TGA・JPG）を読む。jpeg は zune-jpeg（MIT OR Apache-2.0 OR Zlib）
png = "0.18"   # MIT OR Apache-2.0（取り込んだ筆先の画像を、名前つきの灰色の PNG で置く。yolu-io が既に使っている版）
sha2 = "0.10"   # MIT OR Apache-2.0（筆先の画像を内容の SHA-256 で名づける。yolu-io が既に使っている版）
arboard = { version = "3.6", default-features = false, features = ["image-data", "wayland-data-control"] }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }   # MIT（ファイルを選ぶウィンドウ。Windows は OS のウィンドウ、Linux は xdg-desktop-portal）

[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["x11"] }   # Apache-2.0（eframe が使う版と同じ。起動のウィンドウを X11 に決めるため。新しい crate ではない）

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "0.2"           # MIT OR Apache-2.0（落ちたときの記録: Linux はシグナルとバックトレース、macOS はバックトレース。Linux は空き容量・時刻も。新しい crate ではなく、yolu-protocol も使う）

[target.'cfg(target_os = "macos")'.dependencies]
# タブレット（Wacom・XP-Pen などのドライバー）の筆圧・傾き・消しゴムの端を、アプリの NSEvent の監視から読む（`pen::mac_tablet`）。どれも Cargo.lock に既にある版
# （arboard・eframe・rfd・wgpu が使う 0.6 / 0.3 の組。winit 0.30 の 0.5 / 0.2 の組は、winit が 0.31 に上がると消える）で、新しい crate・版は増えない。
# objc2 系は MIT（objc2-app-kit・objc2-foundation は Zlib OR Apache-2.0 OR MIT）。macOS の配布物にだけ入る（`tools/third-party.py --target universal-apple-darwin` が数え、`tools/licenses-reviewed.json` に登録している。Windows の配布物には入らない）
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-core-foundation", "NSApplication", "NSEvent", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSGeometry", "NSString"] }
block2 = "0.6"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
raw-window-handle = "0.6"   # ウィンドウのハンドル（Windows は HWND、macOS は NSView）からペンの入力を繋ぐ

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_Pointer", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi", "Win32_UI_HiDpi", "Win32_System_SystemInformation", "Win32_Networking_WinHttp", "Win32_System_Diagnostics_Debug", "Win32_System_Com", "Win32_System_Kernel", "Win32_System_LibraryLoader", "Win32_Storage_FileSystem", "Win32_System_ProcessStatus", "Win32_System_Shutdown", "Win32_System_Threading", "Win32_Globalization"] }

[dev-dependencies]
pollster = "1"   # 既存の許諾確認済み依存。試験用の描画器選択で非同期の wgpu 初期化を待つ
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot", "eframe"] }
ed25519-dalek = "2.2"   # 試験で、使い捨ての鍵で更新情報に署名する（本物の鍵は使わない）
hex = "0.4"
rusqlite = { version = "0.40", default-features = false, features = ["bundled", "serialize"] }   # MIT。試験で、合成の CLIP STUDIO のブラシ（.sut。SQLite）を一から組む（yolu-io が読み取りに使う版と同じ）
yolu-cli = { path = "../yolu-cli" }   # 試験で、外からの操作の客（コマンドラインの起動中のアプリへの道）を本物の受け口へつなぐ

[build-dependencies]
winresource = "0.1.31"
