[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.6.0"
edition = "2021"
publish = false
license = "MIT"

[workspace.dependencies]
yolu-brush-sets = { path = "crates/yolu-brush-sets" }
yolu-core = { path = "crates/yolu-core" }
yolu-gpu = { path = "crates/yolu-gpu" }
yolu-io = { path = "crates/yolu-io" }
yolu-mcp = { path = "crates/yolu-mcp" }
yolu-model = { path = "crates/yolu-model" }
yolu-ops = { path = "crates/yolu-ops" }
yolu-protocol = { path = "crates/yolu-protocol" }
yolu-update = { path = "crates/yolu-update" }

[profile.dev]
opt-level = 1            # 画素の処理は最適化なしだと遅すぎるので、開発でも少し最適化する
debug = "line-tables-only"  # 行番号だけ（全部のデバッグ情報だと試験の実行ファイルが 1 本 500 MB を超え、作業コピーごとに積み上がる）
[profile.dev.package."*"]
opt-level = 3            # 依存のクレートは最適化して組む（初回だけ時間がかかる）
debug = false
