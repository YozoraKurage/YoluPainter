# egui_kittest のスナップショットの決まり（cargo test は crates/yolu-app で走るので、出力はその tests/snapshots）。
# 正解の PNG はコンテナの既定（wgpu の Vulkan と Mesa の lavapipe、ソフトの描画）で撮ったもの。CI の Linux も同じ組で、Mesa の版が違っても
# 今は全部の画像が 0 画素の差で通る。Mesa の版が上がったとき縁の画素が少しずれても落とさないよう、Linux は閾値を越える画素が
# 4 個までなら通す（GL の llvmpipe で測ると 1〜2 個のずれだった。本当の崩れは数百画素以上）。
# Windows・macOS の実の GPU では縁のアンチエイリアスとテクスチャの補間が少し違うので、その OS では緩める。
output_path = "tests/snapshots"
threshold = 0.6
max_failed_pixels = 4

[windows]
threshold = 2.0
max_failed_pixels = 4000

[mac]
threshold = 2.0
max_failed_pixels = 4000
